      <line x1="100" y1="440" x2="370" y2="468"/><line x1="370" y1="468" x2="640" y2="430"/><line x1="640" y1="430" x2="910" y2="472"/><line x1="910" y1="472" x2="1160" y2="440"/>
      <line x1="80" y1="70" x2="170" y2="250"/><line x1="290" y1="48" x2="170" y2="250"/><line x1="520" y1="90" x2="430" y2="285"/><line x1="520" y1="90" x2="690" y2="250"/><line x1="770" y1="52" x2="690" y2="250"/><line x1="1020" y1="96" x2="950" y2="295"/><line x1="1180" y1="60" x2="1140" y2="250"/>
      <line x1="170" y1="250" x2="100" y2="440"/><line x1="430" y1="285" x2="370" y2="468"/><line x1="430" y1="285" x2="640" y2="430"/><line x1="690" y1="250" x2="640" y2="430"/><line x1="950" y1="295" x2="910" y2="472"/><line x1="1140" y1="250" x2="1160" y2="440"/>
    </g>
    <g fill="#85c345" opacity="0.2">
      <circle cx="80" cy="70" r="3.5"/><circle cx="290" cy="48" r="3.5"/><circle cx="520" cy="90" r="3.5"/><circle cx="770" cy="52" r="3.5"/><circle cx="1020" cy="96" r="3.5"/><circle cx="1180" cy="60" r="3.5"/>
