  <!-- Headline -->
  <g fill="#85c345" font-weight="700">
    <text x="88" y="262" font-size="66" letter-spacing="-1">One graph for</text>
    <text x="88" y="336" font-size="66" letter-spacing="-1">every service.</text>
  </g>

  <!-- Description -->
  <g fill="#9f9fa7" font-size="26">
    <text x="90" y="404">An open-source Rust gateway for GraphQL</text>
    <text x="90" y="440">federation, unifying your services into one</text>
    <text x="90" y="476">fast, governed graph.</text>
  </g>

  <!-- Footer (no license, no bullet) -->
  <text x="90" y="574" font-size="24" fill="#85c345" fill-opacity="0.85">lattice.omni.dev</text>

  <!-- Federation graph (mirrors the hero diagram) -->
  <svg x="600" y="186" width="558" height="268" viewBox="0 0 520 250">
