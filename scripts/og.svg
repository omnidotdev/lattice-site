<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <radialGradient id="glowCore" cx="56%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#85c345" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#85c345" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#85c345" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#85c345" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#85c345" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="60%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#85c345" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

