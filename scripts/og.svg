      <text x="50" y="204" fill="#e4e4e8" font-size="12" font-weight="600">Orders</text>
    </g>

    <!-- clients (right) -->
    <g>
      <rect x="402" y="26" width="106" height="34" rx="9" fill="#85c345" fill-opacity="0.1" stroke="#85c345" stroke-opacity="0.45" stroke-width="1.5"/>
      <g transform="translate(414 36) scale(0.6)" fill="none" stroke="#85c345" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>
