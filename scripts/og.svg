    <text x="260" y="180" text-anchor="middle" fill="#e4e4e8" font-size="14" font-weight="700">Lattice</text>
    <text x="260" y="197" text-anchor="middle" fill="#9f9fa7" font-size="10.5">federation gateway</text>
