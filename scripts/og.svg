      <text x="440" y="204" fill="#e4e4e8" font-size="12" font-weight="600">AI agent</text>
    </g>

    <!-- lattice core -->
    <circle cx="260" cy="121" r="35" fill="#85c345"/>
    <g transform="translate(234 95) scale(0.405)" fill="#09090b">
      <g transform="translate(-23,150) scale(0.1,-0.1)">
